<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Buscador de vuelos en tiempo real, sin límite de búsquedas." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Vuelos · FindMyTrip</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <a href="/" class="brand" aria-label="FindMyTrip, inicio"><span class="brand-mark" style="width: 32px; height: 32px" data-icon="plane"></span> FindMyTrip</a>
          <nav class="nav" aria-label="Principal" data-tabs="text"></nav>
        </div>
      </header>
      <main class="main stack-lg">
        <section class="search-panel" aria-labelledby="search-title">
          <div>
            <h1 id="search-title">¿A dónde vamos?</h1>
            <p class="lead">Vuelos en vivo de aerolíneas y agencias, sin límite de búsquedas.</p>
          </div>
          <div class="search-tabs" role="tablist" aria-label="Tipo de búsqueda">
            <a role="tab" aria-selected="false" class="search-tab-link" href="/?tab=budget">Presupuesto y fechas</a>
            <a role="tab" aria-selected="false" class="search-tab-link" href="/?tab=destination">Ya sé a dónde</a>
            <a role="tab" aria-selected="true" class="search-tab-link on" href="/vuelos.html">Vuelos</a>
          </div>
          <p id="prefill" class="form-error" style="color: #1c1c1e" hidden></p>
          <div id="tpwl-search"></div>
        </section>
        <div id="tpwl-tickets"></div>
        <div id="wl-missing" class="card empty" hidden>
          <h3>El buscador todavía no está activado</h3>
          <p class="muted">Falta pegar el código del White Label de Travelpayouts en <code>partner-head.html</code> y volver a publicar.</p>
        </div>
      </main>
      <nav class="tabbar" aria-label="Principal" data-tabs="icons"></nav>
    </div>
    <script type="module" src="/src/vuelos.ts"></script>
  </body>
</html>
