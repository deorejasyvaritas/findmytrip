<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Buscador de vuelos en tiempo real, sin límite de búsquedas." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Vuelos · FindMyTrip</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <a href="/" class="brand" aria-label="FindMyTrip, inicio"><span class="brand-mark" style="width: 32px; height: 32px" data-icon="plane"></span> FindMyTrip</a>
          <nav class="nav" aria-label="Principal" data-tabs="text"></nav>
        </div>
      </header>
      <main class="main stack-lg">
        <section>
          <h1>Vuelos en vivo</h1>
          <p class="muted" style="margin-top: 8px">
            Precios del momento de aerolíneas y agencias. Sin límite de búsquedas y sin que tus búsquedas anteriores cambien el precio.
          </p>
          <p id="prefill" class="card small" style="margin-top: 16px" hidden></p>
        </section>
        <div class="wl-panel"><div id="tpwl-search"></div></div>
        <div id="tpwl-tickets"></div>
        <div id="wl-missing" class="card empty" hidden>
          <h3>El buscador todavía no está activado</h3>
          <p class="muted">Falta pegar el código del White Label de Travelpayouts en <code>partner-head.html</code> y volver a publicar.</p>
        </div>
      </main>
      <nav class="tabbar" aria-label="Principal" data-tabs="icons"></nav>
    </div>
    <script type="module" src="/src/vuelos.ts"></script>
  </body>
</html>
